# LocoHub publishes datasets, not an analysis package.
# Install contributor dependencies from requirements-curation.txt.
[tool.pytest.ini_options]
testpaths = ["tests", "contributor_tools/common/tests"]
norecursedirs = ["legacy", ".venv", "converted_datasets", "site"]
addopts = "--strict-markers"
markers = ["integration: requires source datasets or native conversion tools"]
