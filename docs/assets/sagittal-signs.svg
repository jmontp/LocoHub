<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" font-size="16">
<title id="t">LocoHub sagittal sign rule</title>
<desc id="d">Side view of a person facing right, walking toward +x, with +y up and +z toward the person's right side, out of the page. Every curved arrow points in the positive direction. Segment angles are counterclockwise-positive: pelvis posterior tilt (anterior tilt negative), trunk leaning back, thigh and shank with the distal end moving forward, foot with toes up. Joint angles are positive in their named direction: hip flexion, knee flexion (a clockwise arrow), ankle dorsiflexion.</desc>
<rect width="400" height="600" fill="#ffffff"/>
<text x="10" y="24" fill="#111111" font-weight="700">Each arrow points in the + direction.</text>
<text x="10" y="44" fill="#b45309"><tspan font-weight="700">Segment angle</tspan><tspan fill="#111111">: counterclockwise +</tspan></text>
<text x="10" y="64" fill="#1d4ed8"><tspan font-weight="700">Joint angle</tspan><tspan fill="#111111">: named direction +</tspan></text>
